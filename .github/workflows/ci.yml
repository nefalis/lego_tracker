name: Django CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov python-dotenv mysqlclient
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --exclude=venv --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --exclude=venv --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    runs-on: ubuntu-22.04
    needs: build
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping --host=localhost --user=root --password=rootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest python-dotenv mysqlclient
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests with pytest
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: backend.settings
        working-directory: backend
        run: |
          pytest --cov=./ --cov-report term --cov-fail-under=10

  containerize:
    needs: [build, test]
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        env:
          COMMIT_HASH: ${{ github.sha }}
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/lego-tracker:${COMMIT_HASH} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/lego-tracker:${COMMIT_HASH} ${{ secrets.DOCKER_USERNAME }}/lego-tracker:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/lego-tracker:${COMMIT_HASH}
          docker push ${{ secrets.DOCKER_USERNAME }}/lego-tracker:latest
